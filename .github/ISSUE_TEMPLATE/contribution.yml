name: Task, policy, platform or result proposal
description: Propose a method or ask about a result. Formal results use public evidence-package PRs.
body:
  - type: markdown
    attributes:
      value: |
        This issue is public immediately. Read README public-data terms before posting.
        No credentials, personal sessions or raw jobs. No private evidence workspace is needed.
  - type: dropdown
    id: kind
    attributes:
      label: Contribution type
      options:
        - Task / policy / evaluation method
        - Platform / harness integration
        - Result / report
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What are you contributing?
      description: Capability covered, platform, or report scope. No private data.
    validations:
      required: true
  - type: textarea
    id: verification
    attributes:
      label: How can it be checked?
      description: Reproduction steps, reference/negative examples, versions and limitations.
    validations:
      required: true
  - type: dropdown
    id: privacy
    attributes:
      label: Evidence sharing
      options:
        - Public-safe evidence available
        - Essential evidence cannot be published yet; proposal only
        - Proposal only; evidence not collected yet
    validations:
      required: true
  - type: textarea
    id: resources
    attributes:
      label: Accounts, compute and cost
      description: State requirements, not credentials. Submission does not authorize spending.
