title: "[Result] "
body:
  - type: markdown
    attributes:
      value: |
        Optional result discussion; formal submissions use the public evidence-package
        PR described in docs/submissions.md. Everything here is public immediately.
        Keep credentials, raw jobs and private sessions out. Unknown cost stays unknown.
        Maintainer acceptance, independent reproduction and publication are separate.
  - type: textarea
    id: result
    attributes:
      label: What did you test?
      description: Task and version, platform/harness/model if known, date, attempts and outcome.
    validations:
      required: true
  - type: textarea
    id: method
    attributes:
      label: Method and limitations
      description: Prompt/rubric versions, follow-ups, evaluation method, time/cost basis and what was not checked.
    validations:
      required: true
  - type: dropdown
    id: evidence
    attributes:
      label: Evidence availability
      options:
        - Public-safe evidence available
        - Essential evidence cannot be published yet; discussion only
    validations:
      required: true
  - type: textarea
    id: links
    attributes:
      label: Public evidence links (optional)
      description: Link your public submission PR or authorized public evidence. Do not share private data.
